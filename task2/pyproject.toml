[project]
name = "benchmark-reference"
version = "0.1.0"
description = "Offline benchmark validation, stratified subset analysis, and paired-image diagnostics."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow==13.0.0",
]

[project.optional-dependencies]
integration = ["tiktoken==0.14.0"]

[project.scripts]
benchmark-reference = "benchmark_reference.cli:main"
lcb-pruning = "benchmark_reference.pruning_cli:main"
aa-lcr-pruning = "benchmark_reference.long_context_cli:main"
part-a-operating-points = "benchmark_reference.operating_cli:main"
mmmu-pairs = "benchmark_reference.mmmu_cli:main"
threshold-decision = "benchmark_reference.threshold_cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_reference"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
