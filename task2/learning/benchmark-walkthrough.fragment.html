<div id="benchmark-learning-walkthrough">
  <style>
    #benchmark-learning-walkthrough {
      color: var(--foreground);
    }
    #benchmark-learning-walkthrough .flow {
      display: grid;
      gap: 16px;
    }
    #benchmark-learning-walkthrough .step-heading {
      padding-right: 90px;
    }
    #benchmark-learning-walkthrough .measurements {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 28px;
    }
    #benchmark-learning-walkthrough .measurement {
      display: grid;
      gap: 4px;
    }
    #benchmark-learning-walkthrough .question-id {
      display: inline-block;
    }
    #benchmark-learning-walkthrough .selection-mark {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--viz-series-1);
    }
    #benchmark-learning-walkthrough .key {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }
    #benchmark-learning-walkthrough .changed-grade {
      color: var(--foreground);
      text-decoration: underline;
      text-decoration-style: double;
    }
    #benchmark-learning-walkthrough .outcome {
      padding-block: 8px;
      border-top: 1px solid var(--border);
    }
    #benchmark-learning-walkthrough [hidden] {
      display: none;
    }
  </style>
  <div class="flow">
    <div class="step-heading">
      <h3 id="learning-stage-title">1 of 5 · Full recorded pool · #14</h3>
      <span class="text-small text-muted"
        >Synthetic teaching data · 8 questions · no model or judge calls</span
      >
    </div>
    <div class="viz-row">
      <button type="button" class="btn" id="learning-back" disabled>
        Previous
      </button>
      <button type="button" class="btn btn-primary" id="learning-next">
        Next
      </button>
      <span
        id="learning-stage-status"
        class="text-small"
        aria-live="polite"
      ></span>
    </div>
    <div id="learning-subset-controls" class="viz-controls" hidden>
      <label class="form-label" for="learning-budget"
        >Questions retained
        <select id="learning-budget" class="form-select">
          <option value="2">2 of 8</option>
          <option value="4">4 of 8</option>
          <option value="8">8 of 8</option>
        </select>
      </label>
      <button type="button" class="btn" id="learning-shuffle">
        Change subset
      </button>
      <span id="learning-seed" class="text-small text-muted"></span>
    </div>
    <div id="learning-judge-controls" class="viz-controls" hidden>
      <label class="form-label" for="learning-flips"
        >Hypothetical changed A grades
        <select id="learning-flips" class="form-select">
          <option value="0">0 changes</option>
          <option value="1">1 success becomes failure</option>
          <option value="2">2 successes become failures</option>
        </select>
      </label>
      <span class="text-small text-muted"
        >Fixed answers · hypothetical grades</span
      >
    </div>
    <div class="key text-small">
      <span
        ><span class="selection-mark" aria-hidden="true"></span>Selected
        question</span
      >
      <span>✓ Correct</span><span>× Incorrect</span><span>— Hidden grade</span>
    </div>
    <table
      class="table table-sm"
      aria-label="Eight synthetic questions, their groups, grades and selected weights"
    >
      <thead>
        <tr>
          <th scope="col">Question</th>
          <th scope="col">Length</th>
          <th scope="col">A</th>
          <th scope="col">B</th>
          <th scope="col" class="text-end">Weight</th>
        </tr>
      </thead>
      <tbody id="learning-questions"></tbody>
    </table>
    <div
      id="learning-metrics"
      class="measurements tabular-nums"
      aria-live="polite"
    ></div>
    <div id="learning-outcome" class="outcome" aria-live="polite"></div>
  </div>
  <script>
    (() => {
      const root = document.getElementById("benchmark-learning-walkthrough");
      const byId = (id) => root.querySelector("#" + id);
      const pool = [
        { id: 1, group: "Short", a: 1, b: 1 },
        { id: 2, group: "Short", a: 1, b: 0 },
        { id: 3, group: "Long", a: 1, b: 1 },
        { id: 4, group: "Long", a: 1, b: 1 },
        { id: 5, group: "Long", a: 1, b: 0 },
        { id: 6, group: "Long", a: 0, b: 1 },
        { id: 7, group: "Long", a: 0, b: 0 },
        { id: 8, group: "Long", a: 0, b: 0 },
      ];
      const titles = [
        "Full recorded pool · #14",
        "Select with grades hidden · #15–16",
        "Raw and weighted estimates · #15–16",
        "Reveal full scores · #17",
        "Change the judge’s grades · #16",
      ];
      let state = { step: 0, budget: 2, seed: 3, flips: 0 };
      function adopt(saved) {
        const value = saved?.privateContent;
        if (!value) return;
        if (Number.isInteger(value.step) && value.step >= 0 && value.step <= 4)
          state.step = value.step;
        if ([2, 4, 8].includes(value.budget)) state.budget = value.budget;
        if (
          Number.isInteger(value.seed) &&
          value.seed >= 0 &&
          value.seed < 1000000
        )
          state.seed = value.seed;
        if ([0, 1, 2].includes(value.flips)) state.flips = value.flips;
      }
      function save() {
        if (window.openai?.setWidgetState) {
          window.openai
            .setWidgetState({
              modelContent: {
                example: "Synthetic 8-question benchmark",
                stage: titles[state.step],
                questionsRetained: state.budget,
                subsetSeed: state.seed,
                hypotheticalGradeChanges: state.flips,
              },
              privateContent: { ...state },
            })
            .catch(() => {});
        }
      }
      function selectedQuestions() {
        // Teaching-only reproducible shuffle. Reads IDs and lengths, never grades.
        const priority = (id) => {
          let x =
            (Math.imul(id + 13, 2654435761) ^
              Math.imul(state.seed + 3, 1597334677)) >>>
            0;
          x ^= x >>> 16;
          x = Math.imul(x, 2246822507);
          x ^= x >>> 13;
          return x >>> 0;
        };
        const shortCount = state.budget === 2 ? 1 : state.budget === 4 ? 1 : 2;
        const result = new Map();
        for (const [group, count, size] of [
          ["Short", shortCount, 2],
          ["Long", state.budget - shortCount, 6],
        ]) {
          const ids = pool.filter((q) => q.group === group).map((q) => q.id);
          ids.sort((a, b) => priority(a) - priority(b) || a - b);
          for (const id of ids.slice(0, count))
            result.set(id, size / (8 * count));
        }
        return result;
      }
      const percent = (x) => (100 * x).toFixed(1).replace(/\.0$/, "") + "%";
      function relation(a, b) {
        if (Math.abs(a - b) < 1e-12) return "A = B";
        return a > b ? "A > B" : "A < B";
      }
      function render() {
        const selected = selectedQuestions();
        const fullA = pool.reduce((sum, q) => sum + q.a, 0) / 8;
        const fullB = pool.reduce((sum, q) => sum + q.b, 0) / 8;
        const raw = (model) =>
          pool.reduce(
            (sum, q) => sum + (selected.has(q.id) ? q[model] : 0),
            0,
          ) / state.budget;
        const weighted = (model) =>
          pool.reduce(
            (sum, q) => sum + (selected.get(q.id) || 0) * q[model],
            0,
          );
        byId("learning-stage-title").textContent =
          `${state.step + 1} of 5 · ${titles[state.step]}`;
        byId("learning-back").disabled = state.step === 0;
        byId("learning-next").disabled = state.step === 4;
        byId("learning-subset-controls").hidden =
          state.step < 1 || state.step > 3;
        byId("learning-judge-controls").hidden = state.step !== 4;
        byId("learning-budget").value = String(state.budget);
        byId("learning-flips").value = String(state.flips);
        byId("learning-seed").textContent = `Subset seed: ${state.seed}`;
        byId("learning-stage-status").textContent =
          state.step === 1 ? "Target grades hidden during selection" : "";
        byId("learning-questions").replaceChildren();
        for (const q of pool) {
          const chosen = state.step > 0 && state.step < 4 && selected.has(q.id);
          const visible =
            state.step === 0 || state.step >= 3 || (state.step === 2 && chosen);
          const changed = state.step === 4 && q.id <= state.flips;
          const row = document.createElement("tr");
          const question = document.createElement("th");
          question.scope = "row";
          if (chosen) {
            const dot = document.createElement("span");
            dot.className = "selection-mark";
            dot.setAttribute("aria-hidden", "true");
            question.appendChild(dot);
          }
          question.appendChild(document.createTextNode(`Q${q.id}`));
          question.setAttribute(
            "aria-label",
            `Question ${q.id}${chosen ? ", selected" : ""}`,
          );
          row.appendChild(question);
          const cells = [
            q.group,
            visible ? (changed ? "× (was ✓)" : q.a ? "✓" : "×") : "—",
            visible ? (q.b ? "✓" : "×") : "—",
            chosen ? percent(selected.get(q.id)) : "—",
          ];
          cells.forEach((text, index) => {
            const cell = document.createElement("td");
            cell.textContent = text;
            if (index === 3) cell.className = "text-end";
            if (index === 1 && changed) cell.className = "changed-grade";
            row.appendChild(cell);
          });
          byId("learning-questions").appendChild(row);
        }
        const metrics = [];
        if (state.step === 0)
          metrics.push(["Full A", percent(fullA)], ["Full B", percent(fullB)]);
        if (state.step === 1)
          metrics.push(
            ["Selected", `${state.budget} of 8`],
            [
              "Short / long selected",
              `${[...selected.keys()].filter((i) => i <= 2).length} / ${[...selected.keys()].filter((i) => i > 2).length}`,
            ],
          );
        if (state.step >= 2 && state.step <= 3)
          metrics.push(
            ["Raw A", percent(raw("a"))],
            ["Weighted A", percent(weighted("a"))],
            ["Weighted B", percent(weighted("b"))],
          );
        if (state.step === 4)
          metrics.push(
            ["Revised full A", percent(fullA - state.flips / 8)],
            ["Full B", percent(fullB)],
          );
        byId("learning-metrics").replaceChildren();
        for (const [label, value] of metrics) {
          const wrapper = document.createElement("div");
          wrapper.className = "measurement";
          const name = document.createElement("span");
          name.className = "text-small text-muted";
          name.textContent = label;
          const output = document.createElement("strong");
          output.textContent = value;
          output.style.fontWeight = "500";
          wrapper.append(name, output);
          byId("learning-metrics").appendChild(wrapper);
        }
        const outcome = byId("learning-outcome");
        if (state.step === 0)
          outcome.textContent = `Full recorded order: ${relation(fullA, fullB)}`;
        if (state.step === 1)
          outcome.textContent =
            "Selection inputs: question IDs and input-length groups";
        if (state.step === 2)
          outcome.textContent = `Population shares: short 25% · long 75% | Subset order: ${relation(weighted("a"), weighted("b"))}`;
        if (state.step === 3)
          outcome.textContent = `Full A ${percent(fullA)} · Full B ${percent(fullB)} | A absolute error: ${(100 * Math.abs(weighted("a") - fullA)).toFixed(1)} percentage points | Order ${relation(fullA, fullB) === relation(weighted("a"), weighted("b")) ? "preserved" : "changed"}`;
        if (state.step === 4)
          outcome.textContent = `Revised full order: ${relation(fullA - state.flips / 8, fullB)} | Changed grades: ${state.flips} | Answer changes: 0`;
      }
      byId("learning-back").addEventListener("click", () => {
        state.step = Math.max(0, state.step - 1);
        render();
        save();
      });
      byId("learning-next").addEventListener("click", () => {
        state.step = Math.min(4, state.step + 1);
        render();
        save();
      });
      byId("learning-budget").addEventListener("change", (event) => {
        state.budget = Number(event.target.value);
        render();
        save();
      });
      byId("learning-shuffle").addEventListener("click", () => {
        state.seed = (state.seed + 1) % 1000000;
        render();
        save();
      });
      byId("learning-flips").addEventListener("change", (event) => {
        state.flips = Number(event.target.value);
        render();
        save();
      });
      window.addEventListener("openai:set_globals", (event) => {
        if (event.detail?.globals?.widgetState) {
          adopt(event.detail.globals.widgetState);
          render();
        }
      });
      adopt(window.openai?.widgetState);
      render();
    })();
  </script>
</div>
